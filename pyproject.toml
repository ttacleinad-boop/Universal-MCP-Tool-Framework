[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-mcp-tool-framework"
version = "0.1.0"
description = "A permission-aware foundation for reusable Model Context Protocol tools."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Boop"}
]
dependencies = [
  "mcp==2.0.0"
]

[project.scripts]
umcp-scaffold = "universal_mcp.scaffold:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"
